<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenKVM Janus Control</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 2rem;
        }
        h1 { color: #e94560; margin-bottom: 1rem; }
        h2 { color: #60a5fa; margin: 1.5rem 0 0.5rem; font-size: 1.1rem; }
        .card {
            background: #16213e;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .video-container { display: flex; gap: 1rem; flex-wrap: wrap; }
        .video-box {
            flex: 1;
            min-width: 300px;
            background: #0f0f1a;
            border-radius: 8px;
            overflow: hidden;
        }
        .video-box h3 {
            background: #16213e;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            color: #60a5fa;
        }
        video { width: 100%; max-height: 250px; background: #000; display: block; }
        .status {
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-size: 0.875rem;
            margin: 0.5rem 0;
        }
        .status.connected { color: #4ade80; background: rgba(74, 222, 128, 0.1); }
        .status.connecting { color: #fbbf24; background: rgba(251, 191, 36, 0.1); }
        .status.disconnected { color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .status.publishing { color: #60a5fa; background: rgba(96, 165, 250, 0.1); }
        button {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 4px;
            font-size: 0.9rem;
            cursor: pointer;
            margin: 0.25rem;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: #e94560; color: white; }
        .btn-primary:hover:not(:disabled) { background: #d63d56; }
        .btn-secondary { background: #4a4a5a; color: white; }
        .btn-secondary:hover:not(:disabled) { background: #5a5a6a; }
        .form-group { margin: 0.75rem 0; }
        label { display: block; margin-bottom: 0.25rem; font-size: 0.85rem; color: #aaa; }
        input, select {
            padding: 0.5rem;
            border: 1px solid #333;
            border-radius: 4px;
            background: #0f0f1a;
            color: #eee;
            font-size: 0.9rem;
        }
        input:focus, select:focus { outline: none; border-color: #60a5fa; }
        .feed-info {
            background: #0f0f1a;
            padding: 0.75rem;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.8rem;
            margin: 0.5rem 0;
            word-break: break-all;
        }
        #logs {
            background: #0f0f1a;
            border-radius: 4px;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.7rem;
            max-height: 200px;
            overflow-y: auto;
        }
        .log-entry { margin: 0.2rem 0; }
        .log-error { color: #ef4444; }
        .log-warn { color: #fbbf24; }
        .log-info { color: #60a5fa; }
        .log-debug { color: #888; }
        .controls-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    </style>
</head>
<body>
    <h1>OpenKVM Janus Control</h1>

    <div class="card">
        <h2>Janus Connection</h2>
        <div class="form-group">
            <label>Janus WebSocket URL</label>
            <input type="text" id="janus-url" value="ws://localhost:27100/janus" style="width: 300px;">
        </div>
        <div class="form-group">
            <label>Room ID</label>
            <input type="number" id="room-id" value="1234" style="width: 100px;">
        </div>
    </div>

    <div class="video-container">
        <div class="video-box">
            <h3>Preview (Publisher)</h3>
            <video id="preview-video" controls muted>
                <source src="sample.webm" type="video/webm">
            </video>
            <div class="card" style="margin: 0; padding: 1rem;">
                <div id="pub-status" class="status disconnected">Not Connected</div>
                <div id="pub-feed" class="feed-info" style="display: none;"></div>
                <div class="controls-row">
                    <button id="pub-start" class="btn-primary">Start Publishing</button>
                    <button id="pub-stop" class="btn-secondary" disabled>Stop</button>
                </div>
            </div>
        </div>

        <div class="video-box">
            <h3>Subscriber</h3>
            <video id="remote-video" autoplay playsinline></video>
            <div class="card" style="margin: 0; padding: 1rem;">
                <div id="sub-status" class="status disconnected">Not Connected</div>
                <div class="form-group">
                    <label>Subscribe to Feed ID (leave empty for auto)</label>
                    <input type="text" id="sub-feed" placeholder="Auto" style="width: 200px;">
                </div>
                <div class="controls-row">
                    <button id="sub-connect" class="btn-primary">Connect</button>
                    <button id="sub-disconnect" class="btn-secondary" disabled>Disconnect</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>Logs</h2>
        <div id="logs"></div>
    </div>

    <script>
    const log = (msg, level = 'info') => {
        const logsEl = document.getElementById('logs');
        const entry = document.createElement('div');
        entry.className = 'log-entry log-' + level;
        entry.textContent = new Date().toISOString().substr(11, 8) + ' [' + level + '] ' + msg;
        logsEl.appendChild(entry);
        logsEl.scrollTop = logsEl.scrollHeight;
    };

    // Publisher state
    const Pub = (() => {
        let ws = null, sessionId = null, handleId = null, transactionId = 0;
        let peerConnection = null, localStream = null, videoRoomId = null, feedId = null;

        const tid = () => 'tx' + (++transactionId);

        const send = (request) => {
            const msg = { transaction: tid(), ...request };
            if (sessionId && !msg.session_id) msg.session_id = sessionId;
            if (handleId && !msg.handle_id) msg.handle_id = handleId;
            log('Pub TX: ' + JSON.stringify(msg).slice(0, 100), 'debug');
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(msg));
            }
        };

        const setStatus = (state, text) => {
            const el = document.getElementById('pub-status');
            el.className = 'status ' + state;
            el.textContent = text;
        };

        const start = () => {
            const server = document.getElementById('janus-url').value;
            const room = parseInt(document.getElementById('room-id').value);

            log('Publisher connecting to ' + server);
            setStatus('connecting', 'Connecting...');

            ws = new WebSocket(server, 'janus-protocol');
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                log('Publisher connected');
                send({ janus: 'create' });
            };

            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                log('Pub RX: ' + JSON.stringify(msg).slice(0, 100), 'debug');

                if (msg.janus === 'success' && msg.data && !msg.session_id) {
                    sessionId = msg.data.id;
                    log('Publisher session: ' + sessionId);
                    send({ janus: 'attach', plugin: 'janus.plugin.videoroom', session_id: sessionId });
                }

                if (msg.janus === 'success' && msg.data && msg.session_id) {
                    handleId = msg.data.id;
                    log('Publisher handle: ' + handleId);
                    send({ janus: 'message', body: { request: 'join', room, ptype: 'publisher', display: 'OpenKVM' }});
                }

                if (msg.janus === 'event' && msg.plugindata) {
                    const data = msg.plugindata.data;
                    log('Publisher event: ' + data.videoroom + (msg.jsep ? ' (has SDP offer)' : ''));

                    if (data.videoroom === 'joined') {
                        videoRoomId = data.room;
                        feedId = data.id;
                        document.getElementById('pub-feed').style.display = 'block';
                        document.getElementByById('pub-feed').innerHTML =
                            'Feed ID: <strong>' + data.id + '</strong><br>' +
                            '<small>Subscribe: ?room=' + data.room + '&mode=subscriber&feed=' + data.id + '</small>';
                        setStatus('publishing', 'Publishing...');

                        if (msg.jsep) {
                            log('Publisher received offer from Janus, answering...');
                            peerConnection = new RTCPeerConnection({
                                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                            });
                            peerConnection.onicecandidate = (e) => {
                                if (e.candidate) {
                                    send({ janus: 'trickle', candidate: {
                                        sdpMid: e.candidate.sdpMid,
                                        sdpMLineIndex: e.candidate.sdpMLineIndex,
                                        candidate: e.candidate.candidate
                                    }});
                                }
                            };
                            peerConnection.oniceconnectionstatechange = () => {
                                log('Pub ICE: ' + peerConnection.iceConnectionState);
                            };
                            peerConnection.ontrack = (e) => {
                                log('Pub remote track received');
                            };
                            await peerConnection.setRemoteDescription(msg.jsep);
                            const answer = await peerConnection.createAnswer();
                            await peerConnection.setLocalDescription(answer);
                            send({
                                janus: 'message',
                                body: { request: 'publish', room: videoRoomId, audiocodec: 'opus', videocodec: 'vp8' },
                                jsep: { type: 'answer', sdp: answer.sdp }
                            });
                        } else {
                            startPublishing();
                        }
                    }
                }

                if (msg.jsep) {
                    log('Publisher SDP: ' + msg.jsep.type);
                }

                if (msg.webrtcup) {
                    log('Publisher WebRTC up!', 'info');
                }
            };

            ws.onclose = () => log('Publisher disconnected');
            ws.onerror = () => log('Publisher error', 'error');
        };

        const startPublishing = async () => {
            const video = document.getElementById('preview-video');
            localStream = video.captureStream();
            log('Local stream tracks: ' + localStream.getVideoTracks().length);

            peerConnection = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            });

            peerConnection.onicecandidate = (e) => {
                if (e.candidate) {
                    send({ janus: 'trickle', candidate: {
                        sdpMid: e.candidate.sdpMid,
                        sdpMLineIndex: e.candidate.sdpMLineIndex,
                        candidate: e.candidate.candidate
                    }});
                }
            };

            peerConnection.oniceconnectionstatechange = () => {
                log('Pub ICE: ' + peerConnection.iceConnectionState);
            };

            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            send({
                janus: 'message',
                body: { request: 'publish', room: videoRoomId, audiocodec: 'opus', videocodec: 'vp8' },
                jsep: { type: 'offer', sdp: offer.sdp }
            });

            video.play().catch(e => log('Auto-play: ' + e));
        };

        const stop = () => {
            if (ws) { ws.close(); ws = null; }
            if (peerConnection) { peerConnection.close(); peerConnection = null; }
            sessionId = handleId = videoRoomId = feedId = null;
            localStream = null;
            document.getElementById('pub-feed').style.display = 'none';
            setStatus('disconnected', 'Disconnected');
            document.getElementById('pub-start').disabled = false;
            document.getElementById('pub-stop').disabled = true;
        };

        return { start, stop };
    })();

    // Subscriber state
    const Sub = (() => {
        let ws = null, sessionId = null, handleId = null, transactionId = 0;
        let peerConnection = null, videoRoomId = null;

        const tid = () => 'tx' + (++transactionId);

        const send = (request) => {
            const msg = { transaction: tid(), ...request };
            if (sessionId && !msg.session_id) msg.session_id = sessionId;
            if (handleId && !msg.handle_id) msg.handle_id = handleId;
            log('Sub TX: ' + JSON.stringify(msg).slice(0, 100), 'debug');
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(msg));
            }
        };

        const setStatus = (state, text) => {
            const el = document.getElementById('sub-status');
            el.className = 'status ' + state;
            el.textContent = text;
        };

        const connect = () => {
            const server = document.getElementById('janus-url').value;
            const room = parseInt(document.getElementById('room-id').value);
            const feed = document.getElementById('sub-feed').value;

            log('Subscriber connecting to ' + server);
            setStatus('connecting', 'Connecting...');

            ws = new WebSocket(server, 'janus-protocol');
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                log('Subscriber connected');
                send({ janus: 'create' });
            };

            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                log('Sub RX: ' + JSON.stringify(msg).slice(0, 100), 'debug');

                if (msg.janus === 'success' && msg.data && !msg.session_id) {
                    sessionId = msg.data.id;
                    log('Subscriber session: ' + sessionId);
                    send({ janus: 'attach', plugin: 'janus.plugin.videoroom', session_id: sessionId });
                }

                if (msg.janus === 'success' && msg.data && msg.session_id) {
                    handleId = msg.data.id;
                    log('Subscriber handle: ' + handleId);

                    peerConnection = new RTCPeerConnection({
                        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                    });

                    peerConnection.onicecandidate = (e) => {
                        if (e.candidate) {
                            send({ janus: 'trickle', candidate: {
                                sdpMid: e.candidate.sdpMid,
                                sdpMLineIndex: e.candidate.sdpMLineIndex,
                                candidate: e.candidate.candidate
                            }});
                        }
                    };

                    peerConnection.ontrack = (e) => {
                        log('Remote track received');
                        document.getElementById('remote-video').srcObject = e.streams[0];
                    };

                    peerConnection.oniceconnectionstatechange = () => {
                        log('Sub ICE: ' + peerConnection.iceConnectionState);
                    };

                    const joinBody = { request: 'join', room, ptype: 'subscriber' };
                    if (feed) {
                        joinBody.feed = parseInt(feed);
                    }
                    send({ janus: 'message', body: joinBody });
                }

                if (msg.janus === 'event' && msg.plugindata) {
                    const data = msg.plugindata.data;
                    log('Subscriber event: ' + JSON.stringify(data));

                    if (data.videoroom === 'attached') {
                        log('Subscribed to feed: ' + data.id);
                    }

                    if (data.videoroom === 'event' && data.publishers && !feed) {
                        if (data.publishers.length > 0) {
                            const pub = data.publishers[0];
                            log('Auto-subscribing to: ' + pub.id);
                            videoRoomId = data.room;
                            send({ janus: 'message', body: { request: 'join', room: data.room, ptype: 'subscriber', feed: pub.id }});
                        }
                    }
                }

                if (msg.jsep) {
                    log('Sub SDP: ' + msg.jsep.type);
                    peerConnection.setRemoteDescription(msg.jsep)
                        .then(() => {
                            if (msg.jsep.type === 'offer') {
                                return peerConnection.createAnswer();
                            }
                        })
                        .then(answer => {
                            if (answer) {
                                peerConnection.setLocalDescription(answer);
                                send({
                                    janus: 'message',
                                    body: { request: 'start', room: videoRoomId },
                                    jsep: { type: 'answer', sdp: answer.sdp }
                                });
                            }
                        })
                        .catch(err => log('SDP error: ' + err, 'error'));
                }

                if (msg.webrtcup) {
                    log('Subscriber WebRTC up!', 'info');
                    setStatus('connected', 'Receiving video');
                }
            };

            ws.onclose = () => { log('Subscriber disconnected'); setStatus('disconnected', 'Disconnected'); };
            ws.onerror = () => log('Subscriber error', 'error');
        };

        const disconnect = () => {
            if (ws) { ws.close(); ws = null; }
            if (peerConnection) { peerConnection.close(); peerConnection = null; }
            sessionId = handleId = videoRoomId = null;
            document.getElementById('remote-video').srcObject = null;
            setStatus('disconnected', 'Disconnected');
            document.getElementById('sub-connect').disabled = false;
            document.getElementById('sub-disconnect').disabled = true;
        };

        return { connect, disconnect };
    })();

    // Event bindings
    document.getElementById('pub-start').addEventListener('click', () => {
        document.getElementById('pub-start').disabled = true;
        document.getElementById('pub-stop').disabled = false;
        Pub.start();
    });

    document.getElementById('pub-stop').addEventListener('click', () => {
        Pub.stop();
    });

    document.getElementById('sub-connect').addEventListener('click', () => {
        document.getElementById('sub-connect').disabled = true;
        document.getElementById('sub-disconnect').disabled = false;
        Sub.connect();
    });

    document.getElementById('sub-disconnect').addEventListener('click', () => {
        Sub.disconnect();
    });

    log('OpenKVM Janus Control ready');
    </script>
</body>
</html>
