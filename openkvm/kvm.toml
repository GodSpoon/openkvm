# OpenKVM Configuration
# See kvm.new.toml for all available options

[websocket]
addr = ":8080"
path = "/websockify"
cors = true
timeout = 30

[vnc]
path = "./noVNC"
username = "openkvm"
password = "passwd12"

[keyboard]
type = "none"

[video]
type = "shell"
src = [
    "v4l2-ctl",
    "--device=/dev/video0",
    "--stream-mmap",
    "--set-fmt-video=width=1920,height=1080,pixelformat=RGB3",
    "--stream-to=-",
]
width = 1280
height = 720
frame_rate = 30
quality = 85
slice_count = 4

[mouse]
type = "none"

[button]
type = "none"

[clipboard]
type = "none"
