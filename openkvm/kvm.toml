# OpenKVM Configuration
# See kvm.new.toml for all available options

[websocket]
addr = ":8080"
path = "/websockify"
cors = true
timeout = 30

[vnc]
path = "./noVNC"
username = ""
password = ""

[keyboard]
type = "none"

[video]
type = "shell"
src = [
    "ffmpeg",
    "-re",
    "-stream_loop",
    "-1",
    "-i",
    "/app/sample.webm",
    "-f",
    "mjpeg",
    "-q:v",
    "5",
    "-",
]
width = 1280
height = 720
frame_rate = 30
quality = 85
slice_count = 4

[mouse]
type = "none"

[button]
type = "none"

[clipboard]
type = "none"
